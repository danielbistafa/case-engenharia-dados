bundle:
  name: case-engenharia-dados

variables:
  catalog:
    default: workspace
  schema:
    default: brasileirao
  volume:
    default: case_dados
  secret_scope:
    default: case-engenharia-dados
  secret_key:
    default: masking-salt

resources:
  jobs:
    pipeline_brasileirao:
      name: case-engenharia-dados-${bundle.target}
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
      tasks:
        - task_key: bronze
          spark_python_task:
            python_file: ./src/databricks_entrypoint.py
            parameters:
              - --stage
              - bronze
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --volume
              - ${var.volume}
              - --execution-id
              - "{{job.run_id}}"
          environment_key: default

        - task_key: silver
          depends_on:
            - task_key: bronze
          spark_python_task:
            python_file: ./src/databricks_entrypoint.py
            parameters:
              - --stage
              - silver
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --volume
              - ${var.volume}
              - --execution-id
              - "{{job.run_id}}"
          environment_key: default

        - task_key: gold
          depends_on:
            - task_key: silver
          spark_python_task:
            python_file: ./src/databricks_entrypoint.py
            parameters:
              - --stage
              - gold
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --volume
              - ${var.volume}
              - --execution-id
              - "{{job.run_id}}"
          environment_key: default

        - task_key: security
          depends_on:
            - task_key: gold
          spark_python_task:
            python_file: ./src/databricks_entrypoint.py
            parameters:
              - --stage
              - security
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --volume
              - ${var.volume}
              - --execution-id
              - "{{job.run_id}}"
              - --secret-scope
              - ${var.secret_scope}
              - --secret-key
              - ${var.secret_key}
          environment_key: default

        - task_key: register_tables
          depends_on:
            - task_key: security
          spark_python_task:
            python_file: ./src/databricks_entrypoint.py
            parameters:
              - --stage
              - register
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --volume
              - ${var.volume}
              - --execution-id
              - "{{job.run_id}}"
          environment_key: default

        - task_key: health_check
          depends_on:
            - task_key: register_tables
          spark_python_task:
            python_file: ./src/databricks_entrypoint.py
            parameters:
              - --stage
              - health-check
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --volume
              - ${var.volume}
              - --execution-id
              - "{{job.run_id}}"
          environment_key: default

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
